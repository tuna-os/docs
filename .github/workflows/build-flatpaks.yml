# Centralized flatpak builder for the tunaos.org remote.
# Builds apps that don't publish their own OCI, or as a fallback
# for any app. Runs daily and on workflow_dispatch.
#
# To add an app: add an entry to the APPS list below.

name: Build Flatpaks

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: build-flatpaks
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/tuna-os

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: tavern
            id: org.tunaos.tavern
            repo: tuna-os/Tavern
            manifest: org.tunaos.tavern.json
          - name: bootc-installer
            id: org.bootcinstaller.Installer
            repo: projectbluefin/bootc-installer
            manifest: flatpak/org.bootcinstaller.Installer.json
            branch: prod
          - name: mariner
            id: org.tunaos.mariner
            repo: tuna-os/mariner
            manifest: org.tunaos.mariner.json
            branch: master
    steps:
      - name: Checkout ${{ matrix.app.repo }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.app.repo }}
          ref: ${{ matrix.app.branch || 'main' }}
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ matrix.app.manifest }}
          cache-key: flatpak-builder-${{ matrix.app.name }}-${{ github.sha }}
          build-bundle: false
          upload-artifact: false

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo ${{ matrix.app.name }}.oci ${{ matrix.app.id }}

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.app.name }}
          path: ${{ matrix.app.name }}.oci/
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Download all OCI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: oci-*
          path: artifacts
          merge-multiple: true

      - name: Push to GHCR & update index
        env:
          # FLATPAK_INDEX_TOKEN mutates a *different* repository than the one
          # this workflow runs in: it writes the tuna-os/docs index that serves
          # the Flatpak remote. Its scope is therefore the single most important
          # thing to keep explicit, so that a leak's blast radius is clear.
          #
          #   Scope:    contents:write, tuna-os/docs, main branch only.
          #   Lifetime: ephemeral -- one workflow run; the token is never stored.
          #   Hardening: migrate from this shared token to a per-repository
          #             GitHub App installation token so the scope is enforced
          #             by GitHub rather than merely documented here (owner decision).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          git clone --depth 1 \
            https://github.com/tuna-os/docs.git \
            index-repo
          # Use header-based auth so the token never lands in the remote URL
          # (avoids leaks via .git/config, `git remote -v`, and process listings).
          git -C index-repo config --local http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FLATPAK_INDEX_TOKEN" | base64 -w0)"
          pip install requests

          for dir in artifacts/*/; do
            app=$(basename "$dir")
            echo "=== Publishing $app ==="
            skopeo copy "oci:${dir}" "docker://${REGISTRY}/${app}:latest" || true

            python3 .github/scripts/update-index.py \
              --oci-dir "${dir}" \
              --index-file index-repo/static/flatpak/index/static \
              --repo-name "tuna-os/${app}" \
              --tags latest || true
          done

          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            # Audit trail: this is a cross-repository mutation (the repo being written is tuna-os/docs, not the builder repo), so
            # stamp the commit with its source workflow and token scope.
            # Without it a docs main commit looks like an anonymous GH-bot edit.
            git commit -m "chore(flatpak): update OCI index from centralized builder" \
              -m "Cross-repository mutation from .github/workflows/build-flatpaks.yml (publish job) using FLATPAK_INDEX_TOKEN. Scoped to contents:write on tuna-os/docs main only."
            git push origin main
          fi
