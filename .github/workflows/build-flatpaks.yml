# Centralized flatpak builder for the tunaos.org remote.
# Builds apps that don't publish their own OCI, or as a fallback
# for any app. Runs daily and on workflow_dispatch.
#
# To add an app: add a build matrix entry and matching download/index steps below.

name: Build Flatpaks

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: build-flatpaks
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tuna-os

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: tavern
            id: org.tunaos.tavern
            repo: tuna-os/Tavern
            manifest: org.tunaos.tavern.json
          - name: bootc-installer
            id: org.bootcinstaller.Installer
            repo: projectbluefin/bootc-installer
            manifest: flatpak/org.bootcinstaller.Installer.json
            branch: prod
          - name: mariner
            id: org.tunaos.mariner
            repo: tuna-os/mariner
            manifest: org.tunaos.mariner.json
            branch: master
    steps:
      - name: Checkout ${{ matrix.app.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.app.repo }}
          ref: ${{ matrix.app.branch || 'main' }}
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: ${{ matrix.app.manifest }}
          cache-key: flatpak-builder-${{ matrix.app.name }}-${{ github.sha }}
          build-bundle: false
          upload-artifact: false

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo ${{ matrix.app.name }}.oci ${{ matrix.app.id }}

      - name: Upload OCI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oci-${{ matrix.app.name }}
          path: ${{ matrix.app.name }}.oci/
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tavern OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oci-tavern
          path: artifacts/tavern

      - name: Download bootc-installer OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oci-bootc-installer
          path: artifacts/bootc-installer

      - name: Download mariner OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oci-mariner
          path: artifacts/mariner

      - name: Prepare index checkout and push images to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          git clone --depth 1 \
            https://github.com/tuna-os/docs.git \
            index-repo
          # Use header-based auth so the token never lands in the remote URL
          # (avoids leaks via .git/config, `git remote -v`, and process listings).
          git -C index-repo config --local http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FLATPAK_INDEX_TOKEN" | base64 -w0)"

          for dir in artifacts/*/; do
            app=$(basename "$dir")
            echo "=== Publishing $app ==="
            skopeo copy "oci:${dir}" "docker://${REGISTRY}/${app}:latest" || true
          done

      # Keep updates sequential: each app merges into the same index file.
      # Match the previous per-app `|| true` policy so one failure does not
      # prevent other apps from updating the index.
      - name: Update tavern index
        uses: tuna-os/.github/.github/actions/update-flatpak-index@main
        continue-on-error: true
        with:
          oci-dir: artifacts/tavern/
          index-file: index-repo/static/flatpak/index/static
          repo-name: tuna-os/tavern
          tags: latest
          require-appstream: 'false'

      - name: Update bootc-installer index
        uses: tuna-os/.github/.github/actions/update-flatpak-index@main
        continue-on-error: true
        with:
          oci-dir: artifacts/bootc-installer/
          index-file: index-repo/static/flatpak/index/static
          repo-name: tuna-os/bootc-installer
          tags: latest
          require-appstream: 'false'

      - name: Update mariner index
        uses: tuna-os/.github/.github/actions/update-flatpak-index@main
        continue-on-error: true
        with:
          oci-dir: artifacts/mariner/
          index-file: index-repo/static/flatpak/index/static
          repo-name: tuna-os/mariner
          tags: latest
          require-appstream: 'false'

      - name: Commit and push index
        run: |
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update OCI index from centralized builder"
            git push origin main
          fi
