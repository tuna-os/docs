# Centralized flatpak builder for the tunaos.org remote.
# Builds apps that don't publish their own OCI, or as a fallback
# for any app. Runs daily and on workflow_dispatch.
#
# To add an app: add an entry to the APPS list below.

name: Build Flatpaks

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: build-flatpaks
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/tuna-os

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: tavern
            id: org.tunaos.tavern
            repo: tuna-os/Tavern
            manifest: org.tunaos.tavern.json
          - name: bootc-installer
            id: org.bootcinstaller.Installer
            repo: projectbluefin/bootc-installer
            manifest: flatpak/org.bootcinstaller.Installer.json
            branch: prod
          - name: mariner
            id: org.tunaos.mariner
            repo: tuna-os/mariner
            manifest: org.tunaos.mariner.json
            branch: master
    steps:
      - name: Checkout ${{ matrix.app.repo }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.app.repo }}
          ref: ${{ matrix.app.branch || 'main' }}
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ matrix.app.manifest }}
          cache-key: flatpak-builder-${{ matrix.app.name }}-${{ github.sha }}
          build-bundle: false
          upload-artifact: false

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo ${{ matrix.app.name }}.oci ${{ matrix.app.id }}

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.app.name }}
          path: ${{ matrix.app.name }}.oci/
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Download all OCI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: oci-*
          path: artifacts
          merge-multiple: true

      - name: Push to GHCR & update index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          git clone --depth 1 \
            https://github.com/tuna-os/docs.git \
            index-repo
          # Use header-based auth so the token never lands in the remote URL
          # (avoids leaks via .git/config, `git remote -v`, and process listings).
          git -C index-repo config --local http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FLATPAK_INDEX_TOKEN" | base64 -w0)"
          pip install requests

          staged_index="index-repo/static/flatpak/index/static"

          # Fail closed: track any publication failure. If any app copy or index
          # update fails, abort before committing or pushing changes.
          FAILED=0
          for dir in artifacts/*/; do
            app=$(basename "$dir")
            echo "=== Publishing $app ==="
            if ! skopeo copy "oci:${dir}" "docker://${REGISTRY}/${app}:latest"; then
              echo "::error::Failed to copy OCI image for $app"
              FAILED=1
              continue
            fi

            if ! python3 .github/scripts/update-index.py \
              --oci-dir "${dir}" \
              --index-file "${staged_index}" \
              --repo-name "tuna-os/${app}" \
              --tags latest; then
              echo "::error::Failed to update index for $app"
              FAILED=1
              continue
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more applications failed to publish. Aborting catalog update."
            exit 1
          fi

          # Validate the staged index structure before committing
          python3 -c "
          import json
          from pathlib import Path

          index_path = Path('${staged_index}')
          if not index_path.is_file():
              raise SystemExit(f'Index file not found: {index_path}')
          data = json.loads(index_path.read_text())
          if not isinstance(data, dict):
              raise SystemExit('Index root must be a JSON object')
          if not data.get('Registry'):
              raise SystemExit('Index missing Registry key')
          results = data.get('Results')
          if not isinstance(results, list):
              raise SystemExit('Index Results must be a list')
          for res in results:
              if not res.get('Name'):
                  raise SystemExit('Result entry missing Name')
              images = res.get('Images')
              if not isinstance(images, list) or not images:
                  raise SystemExit(f'Result {res.get(\"Name\")} has no images')
              for img in images:
                  if not img.get('Digest') or not img.get('Architecture'):
                      raise SystemExit(f'Image in {res.get(\"Name\")} missing Digest or Architecture')
                  labels = img.get('Labels', {})
                  if not labels.get('org.flatpak.ref') or not labels.get('org.flatpak.metadata'):
                      raise SystemExit(f'Image in {res.get(\"Name\")} missing required Flatpak labels')
          print('Staged index validation passed.')
          "

          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update OCI index from centralized builder"
            git push origin main
          fi
