# One Linux build supplies both Workers validation and onboarding evidence.
# It runs when the change touches the site or its tooling, and on main, daily
# and on dispatch. macOS repeats a fresh install/build on main, daily, on
# dispatch and on a PR labelled run-heavy; on a PR the Linux lane already runs
# the same `npm ci` and `npm run build`.
name: bootstrap

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ github.repository == 'tuna-os/docs' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # the run-heavy label, read live so a re-run sees it
    outputs:
      site: ${{ steps.changes.outputs.site }}
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select onboarding coverage
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ||
                -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            { echo 'site=true'; echo 'macos=true'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > changed-paths
          else
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > changed-paths
          fi
          site=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|blog/*|src/*|static/*|scripts/*|worker/*|\
              *.json|*.jsonc|*.js|*.mjs|*.ts|*.css|*.mdx|\
              justfile|.npmrc|.nvmrc|.node-version|.tool-versions|.editorconfig|\
              .github/scripts/*|.github/actions/*|\
              .github/workflows/bootstrap.yml|.github/workflows/workers-build.yml|\
              .github/workflows/lint.yml)
                site=true
                break
                ;;
            esac
          done < changed-paths
          macos=$site
          if [[ "$EVENT" == pull_request ]]; then
            labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
            grep -qx run-heavy <<<"$labels" || macos=false
          fi
          { echo "site=$site"; echo "macos=$macos"; } >> "$GITHUB_OUTPUT"

  workers:
    needs: changes
    if: ${{ github.repository == 'tuna-os/docs' && needs.changes.outputs.site == 'true' }}
    uses: $/.github/workflows/workers-build.yml

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    outputs:
      install: ${{ steps.install.outcome }}
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Build the site
        id: site
        run: npm run build

  # Retain the existing check names, without a second Linux npm ci/site build.
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    needs: [changes, workers, macos]
    if: ${{ always() && github.repository == 'tuna-os/docs' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ubuntu-26.04
    steps:
      - name: Report onboarding result
        env:
          OS: ${{ matrix.os }}
          CHANGES: ${{ needs.changes.result }}
          MACOS_REQUIRED: ${{ needs.changes.outputs.macos }}
          LINUX_REQUIRED: ${{ needs.changes.outputs.site }}
          MACOS_RESULT: ${{ needs.macos.result }}
          INSTALL: ${{ needs[matrix.os == 'ubuntu-24.04' && 'workers' || 'macos'].outputs.install }}
          SITE: ${{ needs[matrix.os == 'ubuntu-24.04' && 'workers' || 'macos'].outputs.site }}
        run: |
          if [[ "$OS" == macos-latest ]]; then
            [[ "$CHANGES" == success ]]
            if [[ "$MACOS_REQUIRED" != true ]]; then
              echo 'macOS did not run: it runs on main, daily, on manual dispatch and on a pull request labelled run-heavy.'
              exit 0
            fi
            [[ "$MACOS_RESULT" == success ]]
            exit 0
          fi
          [[ "$CHANGES" == success ]]
          if [[ "$LINUX_REQUIRED" != true ]]; then
            echo 'No site or onboarding tooling changed; the Linux build runs on those changes, on main, daily and on manual dispatch.'
            exit 0
          fi
          [[ "$INSTALL" == success && "$SITE" == success ]]

  build:
    name: Build tunaos-org
    needs: [changes, workers]
    if: ${{ always() && github.repository == 'tuna-os/docs' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Report Workers validation result
        env:
          CHANGES: ${{ needs.changes.result }}
          LINUX_REQUIRED: ${{ needs.changes.outputs.site }}
          RESULT: ${{ needs.workers.result }}
        run: |
          [[ "$CHANGES" == success ]]
          [[ "$LINUX_REQUIRED" != true ]] || test "$RESULT" = success

  # Only this job can write issues. It never checks out or executes PR code.
  bootstrap-issues:
    needs: [workers, macos]
    if: ${{ always() && github.repository == 'tuna-os/docs' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ubuntu-26.04
    steps:
      - name: Update onboarding tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Bootstrap is broken on ${{ matrix.os }}"
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL: ${{ needs[matrix.os == 'ubuntu-24.04' && 'workers' || 'macos'].outputs.install }}
          SITE: ${{ needs[matrix.os == 'ubuntu-24.04' && 'workers' || 'macos'].outputs.site }}
        run: |
          if [[ "$INSTALL" == failure || "$SITE" == failure ]]; then
            gh issue list --state open --search "${TITLE} in:title" \
              --json number --jq '.[].number' | grep -q . || \
            gh issue create --title "$TITLE" --label bootstrap \
              --body "Bootstrap failed: ${URL}"
          elif [[ "$INSTALL" == success && "$SITE" == success ]]; then
            gh issue list --state open --search "${TITLE} in:title" \
              --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --comment "Bootstrap is green again."
            done
          fi
