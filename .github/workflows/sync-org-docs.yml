# Syncs READMEs and docs from every active project in the tuna-os GitHub
# org into the Docusaurus site. Runs daily; opens a PR on changes.
#
# New repos with a README are automatically picked up — no per-project
# config needed here (see scripts/sync-org-docs.mjs for the repo list).

name: sync-org-docs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    if: ${{ github.repository == 'tuna-os/docs' }}
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked] create-pull-request pushes the branch from this checkout
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from all tuna-os org repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-org-docs.mjs

      # Upstream READMEs arrive with markdownlint findings that the required
      # Markdown Lint job counts against .markdownlint-budget, so a sync could
      # push the total over budget (#754: 1836 > 1500). Apply markdownlint's
      # safe auto-fixes to the synced files only, with the release lint.yml pins.
      - name: Auto-fix markdownlint findings in synced files
        run: | # zizmor: ignore[adhoc-packages] pinned to the markdownlint-cli release lint.yml uses
          mapfile -t synced < <( { git diff --name-only -- 'docs/**/*.md'; git ls-files --others --exclude-standard -- 'docs/**/*.md'; } | sort -u)
          if [ "${#synced[@]}" -gt 0 ]; then
            # MD034's fix wraps bare URLs in <...>, which MDX parses as JSX and
            # fails to compile, so it is left out of the auto-fix.
            npx --yes markdownlint-cli@0.49.1 --fix "${synced[@]}" --disable MD034 || true
          fi

      # Compile the generated pages before opening a PR. This keeps an
      # MDX-incompatible upstream document from blocking the next sync PR's
      # bootstrap checks with errors discovered only after creation.
      - name: Build the synchronized site
        run: npm run build

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync org-wide project docs'
          title: 'chore: sync org-wide project docs'
          body: |
            Automated sync of READMEs and docs from all active
            [tuna-os](https://github.com/tuna-os) repos.
            Review for content accuracy before merging.
          branch: automation/sync-org-docs
          delete-branch: true
          labels: documentation
