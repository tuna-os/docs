# Syncs READMEs and docs from every active project in the tuna-os GitHub
# org into the Docusaurus site. Runs daily; opens a PR on changes.
#
# New repos with a README are automatically picked up — no per-project
# config needed here (see scripts/sync-org-docs.mjs for the repo list).

name: sync-org-docs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    if: ${{ github.repository == 'tuna-os/docs' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from all tuna-os org repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-org-docs.mjs

      # Compile the generated pages before opening a PR. This keeps an
      # MDX-incompatible upstream document from blocking the next sync PR's
      # bootstrap checks with errors discovered only after creation.
      - name: Build the synchronized site
        run: npm run build

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync org-wide project docs'
          title: 'chore: sync org-wide project docs'
          body: |
            Automated sync of READMEs and docs from all active
            [tuna-os](https://github.com/tuna-os) repos.
            Review for content accuracy before merging.
          branch: automation/sync-org-docs
          delete-branch: true
          labels: documentation
