name: Lint

# scripts/** and .ste-budget are here because this workflow is what runs them:
# js-syntax runs scripts/**/*.test.mjs, and the ste job runs scripts/ste-lint.mjs
# against the budget in .ste-budget. Without them a change to the checker, to its
# tests, or to the number they are measured against merged with no job having
# looked at it.
#
# blog/** is here for the same reason: ste-lint counts blog posts towards the
# budget wherever it runs, so without the filter a blog-only PR could push the
# total over the budget and only be caught by the next PR touching docs/**.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'blog/**'
      - '*.md'
      - 'scripts/**'
      - '.ste-budget'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - '*.md'
      - 'scripts/**'
      - '.ste-budget'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint 'docs/**/*.md' '*.md' \
            --ignore docs/docs/tacklebox \
            --disable MD013 MD033 MD041 || \
            echo "NOTE: markdownlint found issues — review and fix"

  # Check for broken internal links using a lightweight markdown link checker
  js-syntax:
    name: Node.js Syntax & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check Node.js script syntax
        run: |
          echo "=== Checking Node.js scripts ==="
          FAILED=0
          for f in scripts/*.mjs scripts/*.js; do
            [[ -f "$f" ]] || continue
            # Skip test files in syntax check (they import from production scripts)
            [[ "$f" == *.test.mjs ]] && continue
            echo "  Checking: $f"
            if ! node --check "$f" 2>/dev/null; then
              echo "    FAILED"
              FAILED=1
            else
              echo "    OK"
            fi
          done
          exit $FAILED

      - name: Check case-colliding documentation paths
        run: node scripts/check-doc-collisions.mjs

      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          FAILED=0
          for f in scripts/__tests__/*.test.mjs scripts/*.test.mjs; do
            [[ -f "$f" ]] || continue
            echo "  Running: $f"
            if ! node "$f"; then
              echo "    FAILED"
              FAILED=1
            else
              echo "    OK"
            fi
          done
          exit $FAILED


  ste:
    name: Simplified Technical English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Rule tests
        run: node scripts/__tests__/ste-lint.test.mjs

      # A budget rather than zero. Conformance is being converted file by file,
      # and a gate that fails on day one gets disabled on day two — so the
      # number only ever goes down. Lower it whenever a batch of prose lands.
      #
      # Generated docs under docs/<slug>/ are skipped: sync-org-docs.mjs
      # overwrites them from each source repo, so the fix belongs upstream.
      # Which trees those are is decided by the sync's own index-page template,
      # not guessed from the links a file happens to contain (#102). The run
      # prints the list, so a tree that enters or leaves the budget is visible
      # in the log rather than only in the total.
      - name: STE budget
        run: |
          node scripts/ste-lint.mjs --summary
          node scripts/ste-lint.mjs --max "$(cat .ste-budget)" >/dev/null

  link-check:
    name: Internal Link Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for broken internal references
        run: |
          echo "=== Checking internal .md links ==="
          ERRORS=0
          for f in $(find docs -name '*.md' -type f); do
            while IFS= read -r link; do
              target=$(echo "$link" | sed -n 's/.*\[.*\](\([^)]*\.md\(#[^)]*\)*\)).*/\1/p')
              [ -z "$target" ] && continue
              target_file="${target%%#*}"
              echo "$target" | grep -qE '^https?://' && continue
              if [ ! -f "$(dirname "$f")/$target_file" ] && [ ! -f "$target_file" ]; then
                echo "  BROKEN: $f -> $target"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(grep -oP '\[.*?\]\([^)]+\.md(#[^)]*)?\)' "$f" 2>/dev/null || true)
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS broken internal links"
          else
            echo "No broken internal links found"
          fi

      - name: Test summary
        if: always()
        run: |
          echo "## Lint Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Markdown Lint | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node.js Syntax | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Internal Link Check | completed |" >> "$GITHUB_STEP_SUMMARY"
