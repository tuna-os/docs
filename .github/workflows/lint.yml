name: Lint

# scripts/** and .ste-budget are here because this workflow is what runs them:
# js-syntax runs unit tests and standalone checks; the ste job checks prose
# against the budget in .ste-budget. Without them a change to the checker, to its
# tests, or to the number they are measured against merged with no job having
# looked at it.
#
# blog/** is here for the same reason: ste-lint counts blog posts towards the
# budget wherever it runs, so without the filter a blog-only PR could push the
# total over the budget and only be caught by the next PR touching docs/**.
# The path filter lives in the `changes` job, not under `on:`: Markdown Lint is
# a required check, and a workflow that a path filter skips never reports, so
# the pull request would wait forever on a check that never appears. A job that
# its `if:` skips reports success, which is what a pull request with nothing to
# lint should show. That replaces lint-required.yml, the paths-ignore twin that
# used to report a no-op `Markdown Lint` on every other pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint: the inputs of the jobs below (the old `paths:` list).
  # build-health: the inputs of the pinned build-health source policy check.
  # A dispatch, or a push range that cannot be read, selects both.
  changes:
    name: select path-scoped jobs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.scope.outputs.lint }}
      build-health: ${{ steps.scope.outputs.build-health }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          lint=false build=false
          case "$EVENT" in
            pull_request) range=("$BASE_SHA...HEAD") ;;
            push)
              if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range=("$BEFORE" HEAD)
              else
                range=()
              fi ;;
            *) range=() ;;
          esac
          if [ "${#range[@]}" -eq 0 ]; then
            lint=true build=true
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/* | blog/* | scripts/* | worker/* | src/* | package.json | package-lock.json | \
                vitest.config.mts | justfile | .github/scripts/* | .ste-budget | .markdownlint-budget | \
                .github/workflows/lint.yml) lint=true ;;
                */*) ;;
                *.md) lint=true ;;
              esac
              case "$f" in
                scripts/build-health-source.json | scripts/check-build-health-source.mjs | \
                src/data/build-health* | .github/workflows/lint.yml) build=true ;;
              esac
            done < <(git diff --name-only "${range[@]}" | tee /dev/stderr)
          fi
          echo "lint=$lint" >> "$GITHUB_OUTPUT"
          echo "build-health=$build" >> "$GITHUB_OUTPUT"

  python-tests:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    name: Flatpak Python Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'

      - name: Install pytest
        run: python3 -m pip install -r .github/scripts/tests/requirements.txt

      - name: Run Flatpak unit tests
        run: python3 -m pytest .github/scripts/tests/ -v

  markdown-lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    name: Markdown Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'

      # Pinned. The budget below is a count of findings, so it only means
      # anything against a fixed rule set — an unpinned install silently
      # rewrites the number every time upstream adds a rule. MD060
      # (table-column-style) is the live example: it is new, and it alone
      # accounts for 1823 of the 2834 findings. Disabling it the way MD013,
      # MD033 and MD041 are disabled would cut the budget to 1011; that is a
      # style call, so it is left to a maintainer rather than taken here.
      - name: Install markdownlint
        run: npm install -g markdownlint-cli@0.49.1 # zizmor: ignore[adhoc-packages] version is pinned; the budget depends on this exact release

      # A budget rather than zero, exactly like the STE job below, and for the
      # same reason: a gate that fails on day one gets disabled on day two.
      # This step used to end in `|| echo "NOTE: ..."`, which made it exit 0
      # whatever markdownlint said — so it reported success on 2834 findings
      # and the summary table below called it "completed".
      #
      # Lower .markdownlint-budget whenever a batch of cleanup lands.
      - name: Run markdownlint
        run: |
          # Disabled rules live in .markdownlint.yaml, not here -- a new
          # markdownlint release adding a rule is what put this job over
          # budget, and a config file is where the next one gets pinned.
          markdownlint 'docs/**/*.md' '*.md' \
            --ignore docs/docs/tacklebox > markdownlint.out 2>&1 || true
          found=$(grep -c ' error ' markdownlint.out || true)
          budget=$(cat .markdownlint-budget)
          echo "markdownlint findings: ${found} (budget ${budget})"
          tail -n 40 markdownlint.out
          if [ "$found" -gt "$budget" ]; then
            echo "::error::markdownlint findings ${found} exceed the budget of ${budget}"
            exit 1
          fi

  # Check for broken internal links using a lightweight markdown link checker
  js-syntax:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    name: Node.js Syntax & Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js script syntax
        run: |
          echo "=== Checking Node.js scripts ==="
          FAILED=0
          for f in scripts/*.mjs scripts/*.js scripts/lib/*.mjs scripts/checks/*.mjs scripts/__tests__/*.test.mjs; do
            [[ -f "$f" ]] || continue
            echo "  Checking: $f"
            if ! node --check "$f" 2>/dev/null; then
              echo "    FAILED"
              FAILED=1
            else
              echo "    OK"
            fi
          done
          exit $FAILED

      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          FAILED=0
          for f in scripts/__tests__/*.test.mjs; do
            [[ -f "$f" ]] || continue
            echo "  Running: $f"
            if ! node "$f"; then
              echo "    FAILED"
              FAILED=1
            else
              echo "    OK"
            fi
          done
          exit $FAILED

      - name: Run standalone checks
        run: |
          set -euo pipefail
          for f in scripts/checks/*.mjs; do
            [[ -f "$f" ]] || continue
            node "$f"
          done

      - name: Run frontend data unit tests
        run: npm run test:unit

      - name: Check documented install commands
        run: npm run check-install-commands


  ste:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    # The linter, its rules and its tests live in tuna-os/.github's ste-lint
    # action, shared with every other repo in the org rather than copied into
    # each one. This repo keeps only .ste-budget -- the number it is measured
    # against.
    #
    # Moving it out is also what gets the synced trees covered. docs/<slug>/ is
    # generated from ~40 repos' READMEs and is deliberately skipped here (a fix
    # is reverted by the next sync, and the author is another repository), so
    # that prose is only ever checked where it is written. Same rules, applied
    # at the source.
    uses: tuna-os/.github/.github/workflows/ste-lint.yml@4078f531ac74703f203bde835ef6c25e9321b97b # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead

  link-check:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    name: Internal Link Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for broken internal references
        run: |
          echo "=== Checking internal .md links ==="
          ERRORS=0
          for f in $(find docs -name '*.md' -type f); do
            while IFS= read -r link; do
              target=$(echo "$link" | sed -n 's/.*\[.*\](\([^)]*\.md\(#[^)]*\)*\)).*/\1/p')
              [ -z "$target" ] && continue
              target_file="${target%%#*}"
              echo "$target" | grep -qE '^https?://' && continue
              if [ ! -f "$(dirname "$f")/$target_file" ] && [ ! -f "$target_file" ]; then
                echo "  BROKEN: $f -> $target"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(grep -oP '\[.*?\]\([^)]+\.md(#[^)]*)?\)' "$f" 2>/dev/null || true)
          done
          # Fails, rather than reporting. This block used to print the
          # count and exit 0, so a broken link merged with a green check and
          # the summary table below still said "completed". There are no
          # broken links today, so there is nothing to ratchet down from.
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS broken internal links"
            exit 1
          fi
          echo "No broken internal links found"

      - name: Test summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Lint Results" >> "$GITHUB_STEP_SUMMARY"
          # Deliberately only reports this job's own result. The old table
          # listed every check as "completed" from inside the link-check job,
          # which knows nothing about the others — so it read as a pass even
          # when a sibling job failed.
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Internal Link Check | ${JOB_STATUS} |" >> "$GITHUB_STEP_SUMMARY"

  # The reviewed tuna-os/tunaOS pin and the schemas copied from it. Not a
  # required check, and only these inputs can change its result.
  pinned-source:
    needs: changes
    if: needs.changes.outputs.build-health == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read reviewed source pin
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = json.load(open('scripts/build-health-source.json'))
          assert pin['repository'] == 'tuna-os/tunaOS'
          assert re.fullmatch('[0-9a-f]{40}', pin['revision'])
          assert re.fullmatch('[0-9]+\.[0-9]+\.[0-9]+', pin['pyyamlVersion'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"revision={pin['revision']}\npyyaml={pin['pyyamlVersion']}\n")
          PY
      - uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/tunaOS
          ref: ${{ steps.pin.outputs.revision }}
          path: .test-deps/tunaos
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - name: Install pinned resolver dependency
        env:
          PYYAML_VERSION: ${{ steps.pin.outputs.pyyaml }}
        run: python3 -m pip install "PyYAML==$PYYAML_VERSION"
      - name: Check copied schemas and required architecture policy
        run: node scripts/check-build-health-source.mjs .test-deps/tunaos
