# Validate the same Docusaurus and Cloudflare Workers build used by the
# tunaos-org Workers deployment.  Cloudflare Workers Builds reports only an
# opaque build ID on pull requests, so keep this failure visible in Actions.
name: Workers Build

on:
  workflow_call:
    outputs:
      install:
        description: Linux onboarding dependency installation outcome
        value: ${{ jobs.build.outputs.install }}
      site:
        description: Linux onboarding site build outcome
        value: ${{ jobs.build.outputs.site }}

permissions:
  contents: read


jobs:
  build:
    name: Build tunaos-org
    runs-on: ubuntu-26.04
    outputs:
      install: ${{ steps.install.outcome }}
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck site sources
        run: npm run typecheck

      - name: Build the site
        id: site
        run: npm run build

      - name: Install browser for metrics checks
        run: npx playwright install --with-deps chromium

      - name: Verify metrics page and accessibility
        run: npm run test:metrics

      - name: Verify build health and accessibility
        run: npm run test:build-health

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate the Worker deployment
        run: wrangler deploy --dry-run
