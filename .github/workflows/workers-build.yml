# Validate the same Docusaurus and Cloudflare Workers build used by the
# tunaos-org Workers deployment.  Cloudflare Workers Builds reports only an
# opaque build ID on pull requests, so keep this failure visible in Actions.
name: Workers Build

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build tunaos-org
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate the Worker deployment
        run: wrangler deploy --dry-run
