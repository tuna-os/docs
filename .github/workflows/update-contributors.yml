# Refresh merged-PR credits and propose them through the protected main
# branch's normal review path. Merging the PR triggers the site deployment.
name: update-contributors

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-wall:
    runs-on: ubuntu-26.04
    if: ${{ github.repository == 'tuna-os/docs' }}
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked] create-pull-request pushes the branch from this checkout

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Regenerate contributors data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-contributors.mjs
          node scripts/__tests__/contributors-wall.test.mjs
          node scripts/__tests__/contributors-data.test.mjs

      - name: Create refresh PR
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-contributors
          delete-branch: true
          add-paths: src/data/contributors.json
          commit-message: 'chore: refresh merged-PR contributor credits'
          title: 'chore: refresh merged-PR contributor credits'
          body: |
            Refresh authors of merged pull requests to public tuna-os repositories.
            Includes forks and archived projects; excludes known bots and AI agents.
            Approve the PR workflows if GitHub requests it, then merge after checks pass.
