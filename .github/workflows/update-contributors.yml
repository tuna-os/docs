# Regenerates src/data/contributors.json from the live tuna-os org so the
# homepage wall of fame reflects current contributors, with no per-release
# action needed here.
#
# Runs scripts/build-contributors.mjs (human-only filter lives there), runs
# the wall tests against the fresh data, and commits the result. The commit
# triggers the site's normal redeploy, so the published wall updates within
# a build cycle.
name: update-contributors

on:
  schedule:
    # Weekly — contributors change slowly, and the step only commits on a
    # real diff.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-wall:
    runs-on: ubuntu-26.04
    if: ${{ github.repository == 'tuna-os/docs' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Regenerate contributors data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-contributors.mjs
          node scripts/__tests__/contributors-wall.test.mjs
          node scripts/__tests__/contributors-data.test.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/contributors.json; then
            echo "No change to contributors.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/contributors.json
          git commit -m "chore: refresh wall-of-fame contributors data"
          git push
