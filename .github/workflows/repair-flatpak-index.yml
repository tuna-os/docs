# Puts the AppStream labels back into the served Flatpak index.
#
# Why this exists: an app's publish step writes its index entry keeping only
# the org.flatpak.* labels, discarding the org.freedesktop.appstream.* ones
# that `flatpak build-bundle --oci` already put on the image. Flatpak builds a
# remote's whole catalogue -- name, icon, licence, screenshots -- from those,
# so every app that republishes drops to a bare application ID with an
# "Unknown" licence in software centres. Coverage was observed going
# 18/20 -> 10/22 -> 6/22 over a few hours, purely from routine republishes.
#
# THIS IS A MITIGATION, NOT THE FIX. The fix is one line in the shared
# publisher at tuna-os/.github (.github/workflows/publish-flatpak.yml):
#
#     keep_prefixes = ("org.flatpak.", "org.freedesktop.appstream.")
#     "Labels": {k: v for k, v in labels.items() if k.startswith(keep_prefixes)}
#
# Once that lands, this workflow stops finding anything to do and can be
# deleted.
name: Repair Flatpak index labels

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour to avoid publish traffic
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never let two repairs race each other onto the same file.
  group: repair-flatpak-index
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repair script lives with the rest of the index tooling rather than
      # being vendored here, so there is one copy to maintain. Vendoring a
      # second copy is exactly how the label bug spread across nine repos.
      - name: Fetch the index tooling
        uses: actions/checkout@v7
        with:
          repository: tuna-os/flatpak-index
          path: .flatpak-index-tools

      - name: Re-read labels from the registry
        run: |
          cp static/flatpak/index/static /tmp/index-before.json
          python3 .flatpak-index-tools/scripts/enrich-index.py \
            static/flatpak/index/static

      # A repair may only ever ADD labels. If a future change to the script
      # would drop an image, alter a digest or remove a label, that is a
      # corrupted index heading for the live remote -- fail instead of
      # committing it.
      - name: Refuse to commit anything but added labels
        run: |
          python3 - <<'PY'
          import json, sys

          before = json.load(open('/tmp/index-before.json'))
          after = json.load(open('static/flatpak/index/static'))

          def skeleton(d):
              return sorted(
                  (r["Name"], i.get("Architecture"), i["Digest"],
                   i.get("MediaType"), tuple(i.get("Tags", [])))
                  for r in d["Results"] for i in r["Images"]
              )

          if skeleton(before) != skeleton(after):
              sys.exit("::error::the image set or a digest changed; refusing to commit")

          def labels(d):
              return {
                  (r["Name"], i.get("Architecture")): set(i.get("Labels", {}))
                  for r in d["Results"] for i in r["Images"]
              }

          lb, la = labels(before), labels(after)
          dropped = {k: sorted(lb[k] - la[k]) for k in lb if lb[k] - la[k]}
          if dropped:
              sys.exit(f"::error::labels would be removed: {dropped}")

          added = sum(len(la[k] - lb[k]) for k in lb)
          covered = sum(
              1 for r in after["Results"] for i in r["Images"]
              if any(k.startswith("org.freedesktop.appstream.")
                     for k in i.get("Labels", {}))
          )
          total = len(skeleton(after))
          print(f"{added} label(s) added; {covered}/{total} images carry AppStream labels")
          PY

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- static/flatpak/index/static; then
            echo "index already complete, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          git commit -m "chore(flatpak): restore AppStream labels in the index"
          # A publish may have landed while this ran; rebase onto it rather
          # than clobbering someone else's index update.
          git pull --rebase origin main
          git push origin HEAD:main
